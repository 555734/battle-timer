name: Build polished Runner God APK

on:
  push:
    branches: [runner-god-polished-godot]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v5

      - name: Assemble Godot source
        run: |
          cat godot_v02/src_chunks/main_00.txt godot_v02/src_chunks/main_01.txt godot_v02/src_chunks/main_02.txt godot_v02/src_chunks/main_03.txt > godot_v02/main.gd
          mkdir -p godot_v02/builds
          wc -l godot_v02/main.gd

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Prepare Android SDK and debug signing
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Export Godot Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./godot_v02
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          verbose: true

      - name: Verify APK
        run: |
          find godot_v02 -type f -name '*.apk' -print
          test -f godot_v02/builds/runner-god-v0.2.apk
          ls -lh godot_v02/builds/runner-god-v0.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-god-v0.2-apk
          path: godot_v02/builds/runner-god-v0.2.apk

      - name: Publish direct-download APK
        run: |
          mkdir -p downloads
          cp godot_v02/builds/runner-god-v0.2.apk downloads/runner-god-v0.2.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/runner-god-v0.2.apk
          git commit -m 'Publish polished Runner God v0.2 APK' || exit 0
          git pull --rebase origin runner-god-polished-godot
          git push origin HEAD:runner-god-polished-godot
