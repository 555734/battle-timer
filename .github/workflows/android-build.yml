name: Build Runner God APK

on:
  push:
    branches:
      - runner-god-android-prototype
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack prototype source
        run: unzip -q prototype.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: runner-god-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK to branch
        run: |
          mkdir -p downloads
          cp runner-god-android/app/build/outputs/apk/debug/app-debug.apk downloads/runner-god-v0.1-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/runner-god-v0.1-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Runner God APK"
            git push origin HEAD:runner-god-android-prototype
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: runner-god-apk
          path: runner-god-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
